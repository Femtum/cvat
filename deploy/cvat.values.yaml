# EKS Auto Mode sizes nodes from requests alone: upstream requests nothing, so
# every pod lands on one c6a.large, which runs out of memory and goes NotReady.
# Requests are each pod's usage at rest; imports and exports burst above them.
cvat:
  backend:
    # rds.force_ssl refuses plain connections; libpq's default, prefer, would
    # fall back to plain text against a server that allowed it.
    additionalEnv:
      - name: PGSSLMODE
        value: require
    defaultStorage:
      storageClassName: cvat-efs
    # The access point writes every file on cvat_data as CVAT's user, so the
    # recursive chmod has nothing to fix. It would also slow every pod start
    # as cvat_data grows, and it requests the server's resources whatever
    # pod it runs in.
    permissionFix:
      enabled: false
    # The Gateway's ALB and then Traefik each append to X-Forwarded-For: with
    # one hop, Django takes the ALB's address for every user's.
    numProxies: 2
    initializer:
      resources:
        requests: {cpu: 100m, memory: 512Mi}
    server:
      resources:
        requests: {cpu: 250m, memory: 1Gi}
    worker:
      export:
        resources:
          requests: {cpu: 50m, memory: 384Mi}
      import:
        resources:
          requests: {cpu: 50m, memory: 384Mi}
      annotation:
        resources:
          requests: {cpu: 50m, memory: 384Mi}
      webhooks:
        resources:
          requests: {cpu: 50m, memory: 384Mi}
      qualityreports:
        resources:
          requests: {cpu: 50m, memory: 384Mi}
      chunks:
        resources:
          requests: {cpu: 50m, memory: 384Mi}
      consensus:
        resources:
          requests: {cpu: 50m, memory: 384Mi}
      utils:
        resources:
          requests: {cpu: 50m, memory: 384Mi}
  frontend:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
  opa:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
  kvrocks:
    resources:
      requests: {cpu: 50m, memory: 256Mi}

clickhouse:
  # Without a limit, ClickHouse sizes its caches from the node's whole memory.
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 2Gi}

grafana:
  resources:
    requests: {cpu: 25m, memory: 128Mi}

vector:
  resources:
    requests: {cpu: 25m, memory: 128Mi}

traefik:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
  # Reached only through the Gateway, routed in http-route.yaml. A
  # LoadBalancer Service would get its own NLB.
  service:
    type: ClusterIP
  ports:
    web:
      # The Gateway ALB's addresses, inside the platform VPC (10.0.0.0/16): without
      # this, Traefik rewrites X-Forwarded-Proto to http and Django answers
      # HTTPS requests as plain HTTP.
      forwardedHeaders:
        trustedIPs:
          - 10.0.0.0/16
  # The Gateway's ALB health-checks each pod with its IP as host, which no
  # CVAT route matches.
  ingressRoute:
    healthcheck:
      enabled: true
      entryPoints:
        - web

# CVAT's database is cvat-database on RDS (infra/). deploy.sh sets
# postgresql.external.host from infra/'s database_address. The password comes
# only from the Secret, as CVAT_POSTGRES_PASSWORD: never also set
# CVAT_POSTGRES_PASSWORD_FILE, CVAT refuses to start with both.
postgresql:
  enabled: false
  secret:
    create: false
    # Synced from Secrets Manager by database-user.external-secret.yaml.
    name: cvat-database-user
