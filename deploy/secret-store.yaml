# Reads CVAT's secrets from Secrets Manager, through infra/'s
# secrets_read_role_arn. The platform's admission policy refuses this store
# unless its role is exactly role/external-secrets/<namespace>-secrets-read, and
# refuses auth, additionalRoles and sessionTags: ESO authenticates as its own
# controller, then assumes this role.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: cvat
spec:
  provider:
    aws:
      service: SecretsManager
      region: ca-central-1
      role: SECRETS_READ_ROLE_ARN
