# Copies rds/cvat_database_user into the Secret the chart's postgresql.secret.name
# names. The chart reads exactly these three keys (helm-chart/templates/_helpers.tpl);
# naming each one makes a sync fail loudly if the secret ever loses one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cvat-database-user
  namespace: cvat
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: cvat-database-user
  data:
    - secretKey: username
      remoteRef:
        key: rds/cvat_database_user
        property: username
    - secretKey: database
      remoteRef:
        key: rds/cvat_database_user
        property: database
    - secretKey: password
      remoteRef:
        key: rds/cvat_database_user
        property: password
