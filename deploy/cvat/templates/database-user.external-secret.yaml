# Copies k8s/<namespace>/database into the Secret upstream's
# postgresql.secret.name names: the platform's ClusterSecretStore lets a
# namespace read its own prefix only. Upstream reads exactly these three keys
# (helm-chart/templates/_helpers.tpl); naming each one makes a sync fail
# loudly if the secret ever loses one. Wave -1: the initializer hook and every
# backend pod, in wave 0, read it.
{{- $remoteKey := printf "k8s/%s/database" .Release.Namespace }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cvat.postgresql.secret.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Values.cvat.postgresql.secret.name }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $remoteKey }}
        property: username
    - secretKey: database
      remoteRef:
        key: {{ $remoteKey }}
        property: database
    - secretKey: password
      remoteRef:
        key: {{ $remoteKey }}
        property: password
