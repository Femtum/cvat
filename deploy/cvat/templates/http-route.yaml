# CVAT's host on the platform's Gateway. Traefik keeps splitting requests by
# path between the frontend, the backend and /analytics, behind its
# forward-auth to CVAT, which the ALB cannot do.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: platform-gateway
      name: platform
      sectionName: https
  hostnames:
    - {{ required "global.hostname is required" .Values.global.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-traefik
          port: 80
