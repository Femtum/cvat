# cvat_data's static volume. Cluster-scoped, so Argo CD's project apps may not
# create it: a cluster admin applies it once, over the Client VPN
# (deploy/README.md). volumeHandle is infra/'s backend_data_volume_handle.
# The volume is reserved for the chart's claim in Argo CD's namespace.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cvat-backend-data
spec:
  # EFS has no size. Kubernetes only binds a claim whose request fits in this.
  capacity:
    storage: 1Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: cvat-efs
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: cvat-rnd
    name: cvat-backend-data
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0d0fe580cb106a236::fsap-0160840e460cf5637
    volumeAttributes:
      encryptInTransit: "true"
