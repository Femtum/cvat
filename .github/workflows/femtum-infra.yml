# Femtum-owned workflow. Not part of upstream cvat-ai/cvat CI.
#
# Checks the formatting of Femtum's Terraform root (infra/), which is added on
# Femtum-<tag> branches under the add-only rule described in FEMTUM.md.
#
# Format only: `terraform init` downloads platform_contract from the private
# Femtum/Infrastructure, which needs a deploy key this repository lacks, so
# `terraform test` runs locally (see infra/README.md).
#
# The `infra-exists` guard job skips the check on a branch without infra/.
name: Femtum - Infra (Terraform)

on:
  push:
    branches:
      - 'Femtum-*'
  pull_request:
    branches:
      - 'Femtum-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infra-exists:
    name: Check infra/ exists
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d infra ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "infra/ does not exist yet on this branch; nothing to check."
          fi

  terraform:
    name: terraform fmt -check
    needs: infra-exists
    if: needs.infra-exists.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive
